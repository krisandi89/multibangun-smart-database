<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multibangun Smart Database - Geosintetik Solutions</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <meta name="description"
        content="Database produk geosintetik PT. Multibangun Rekatama Patria - Distributor resmi Tensar International">

    <!-- Preconnect to CDNs for faster loading -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- Tailwind CSS v3 (stable, compatible) -->
    <script src="https://cdn.tailwindcss.com/3.4.1"></script>

    <!-- React from jsDelivr -->
    <script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7/babel.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');

        * {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        /* Dark mode variables */
        :root {
            --bg-primary: #f8fafc;
            --bg-secondary: #ffffff;
            --bg-card: #ffffff;
            --text-primary: #0f172a;
            --text-secondary: #64748b;
            --text-muted: #94a3b8;
            --border-color: #e2e8f0;
            --search-bg: #ffffff;
        }

        .dark {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --bg-card: #1e293b;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --border-color: #334155;
            --search-bg: #1e293b;
        }

        body {
            background: var(--bg-primary);
            color: var(--text-primary);
            transition: background-color 0.3s, color 0.3s;
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-secondary);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--text-muted);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-secondary);
        }

        /* Gradient text */
        .gradient-text {
            background: linear-gradient(135deg, #dc2626 0%, #ef4444 50%, #f87171 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* Spotlight glow */
        .spotlight-glow {
            background: var(--search-bg);
            box-shadow: 0 0 0 1px var(--border-color),
                0 4px 6px -1px rgba(0, 0, 0, 0.1),
                0 20px 40px -10px rgba(0, 0, 0, 0.1);
        }

        .dark .spotlight-glow {
            box-shadow: 0 0 0 1px var(--border-color),
                0 4px 6px -1px rgba(0, 0, 0, 0.3),
                0 20px 40px -10px rgba(0, 0, 0, 0.3);
        }

        .spotlight-glow:focus-within {
            box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.3),
                0 4px 6px -1px rgba(0, 0, 0, 0.1),
                0 25px 50px -12px rgba(0, 0, 0, 0.15);
        }

        /* Card styles */
        .card-hover {
            background: var(--bg-card);
            border-color: var(--border-color);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .card-hover:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.2);
        }

        /* File type badge colors */
        .badge-brosur {
            background: #dbeafe;
            color: #1e40af;
        }

        .badge-spesifikasi {
            background: #dcfce7;
            color: #166534;
        }

        .badge-metode {
            background: #fef3c7;
            color: #92400e;
        }

        .badge-hasil-uji {
            background: #f3e8ff;
            color: #6b21a8;
        }

        .badge-sertifikasi {
            background: #fce7f3;
            color: #9d174d;
        }

        .badge-case-history {
            background: #e0e7ff;
            color: #3730a3;
        }

        .badge-presentasi {
            background: #ffedd5;
            color: #c2410c;
        }

        .dark .badge-brosur {
            background: #1e3a5f;
            color: #93c5fd;
        }

        .dark .badge-spesifikasi {
            background: #14532d;
            color: #86efac;
        }

        .dark .badge-metode {
            background: #451a03;
            color: #fcd34d;
        }

        .dark .badge-hasil-uji {
            background: #3b0764;
            color: #d8b4fe;
        }

        .dark .badge-sertifikasi {
            background: #500724;
            color: #f9a8d4;
        }

        .dark .badge-case-history {
            background: #1e1b4b;
            color: #a5b4fc;
        }

        .dark .badge-presentasi {
            background: #431407;
            color: #fdba74;
        }

        /* Bottom Sheet Animation */
        @keyframes slideUp {
            from {
                transform: translateY(100%);
                opacity: 0;
            }

            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .animate-slide-up {
            animation: slideUp 0.3s ease-out forwards;
        }

        /* Theme toggle */
        .theme-toggle {
            position: fixed;
            top: 1rem;
            right: 1rem;
            z-index: 100;
            padding: 0.75rem;
            border-radius: 0.75rem;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            cursor: pointer;
            transition: all 0.2s;
        }

        .theme-toggle:hover {
            transform: scale(1.05);
        }
    </style>
</head>

<body class="min-h-screen">

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        // ==================== ICONS ====================
        const Icons = {
            Search: ({ className = "w-6 h-6" }) => (
                <svg xmlns="http://www.w3.org/2000/svg" className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                    <circle cx="11" cy="11" r="8" />
                    <line x1="21" y1="21" x2="16.65" y2="16.65" />
                </svg>
            ),
            Download: ({ className = "w-4 h-4" }) => (
                <svg xmlns="http://www.w3.org/2000/svg" className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                    <polyline points="7 10 12 15 17 10" />
                    <line x1="12" y1="15" x2="12" y2="3" />
                </svg>
            ),
            X: ({ className = "w-5 h-5" }) => (
                <svg xmlns="http://www.w3.org/2000/svg" className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                    <line x1="18" y1="6" x2="6" y2="18" />
                    <line x1="6" y1="6" x2="18" y2="18" />
                </svg>
            ),
            Star: ({ className = "w-4 h-4" }) => (
                <svg xmlns="http://www.w3.org/2000/svg" className={className} viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z" />
                </svg>
            ),
            FileText: ({ className = "w-4 h-4" }) => (
                <svg xmlns="http://www.w3.org/2000/svg" className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
                    <polyline points="14 2 14 8 20 8" />
                    <line x1="16" y1="13" x2="8" y2="13" />
                    <line x1="16" y1="17" x2="8" y2="17" />
                    <polyline points="10 9 9 9 8 9" />
                </svg>
            ),
            Phone: ({ className = "w-5 h-5" }) => (
                <svg xmlns="http://www.w3.org/2000/svg" className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                    <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z" />
                </svg>
            ),
            Folder: ({ className = "w-4 h-4" }) => (
                <svg xmlns="http://www.w3.org/2000/svg" className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                    <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z" />
                </svg>
            ),
            ChevronRight: ({ className = "w-4 h-4" }) => (
                <svg xmlns="http://www.w3.org/2000/svg" className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                    <polyline points="9 18 15 12 9 6" />
                </svg>
            ),
            Command: ({ className = "w-3 h-3" }) => (
                <svg xmlns="http://www.w3.org/2000/svg" className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                    <path d="M18 3a3 3 0 0 0-3 3v12a3 3 0 0 0 3 3 3 3 0 0 0 3-3 3 3 0 0 0-3-3H6a3 3 0 0 0-3 3 3 3 0 0 0 3 3 3 3 0 0 0 3-3V6a3 3 0 0 0-3-3 3 3 0 0 0-3 3 3 3 0 0 0 3 3h12a3 3 0 0 0 3-3 3 3 0 0 0-3-3z" />
                </svg>
            ),
            ExternalLink: ({ className = "w-3 h-3" }) => (
                <svg xmlns="http://www.w3.org/2000/svg" className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                    <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6" />
                    <polyline points="15 3 21 3 21 9" />
                    <line x1="10" y1="14" x2="21" y2="3" />
                </svg>
            ),
            Grid: ({ className = "w-4 h-4" }) => (
                <svg xmlns="http://www.w3.org/2000/svg" className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                    <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/>
                </svg>
            ),
            List: ({ className = "w-4 h-4" }) => (
                <svg xmlns="http://www.w3.org/2000/svg" className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                    <line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/>
                </svg>
            ),
            Layers: ({ className = "w-4 h-4" }) => (
                <svg xmlns="http://www.w3.org/2000/svg" className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                    <polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/>
                </svg>
            ),
            Plus: ({ className = "w-4 h-4" }) => (
                <svg xmlns="http://www.w3.org/2000/svg" className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                    <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
                </svg>
            ),
            Upload: ({ className = "w-4 h-4" }) => (
                <svg xmlns="http://www.w3.org/2000/svg" className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/>
                </svg>
            )
        };

        // ==================== FILE TYPE CONFIG ====================
        const fileTypeConfig = {
            'brosur': { label: 'Brosur', badge: 'badge-brosur', icon: '📄' },
            'spesifikasi': { label: 'Spesifikasi', badge: 'badge-spesifikasi', icon: '📋' },
            'metode': { label: 'Metode', badge: 'badge-metode', icon: '🔧' },
            'hasil-uji': { label: 'Hasil Uji', badge: 'badge-hasil-uji', icon: '🧪' },
            'sertifikasi': { label: 'Sertifikasi', badge: 'badge-sertifikasi', icon: '✅' },
            'case-history': { label: 'Case History', badge: 'badge-case-history', icon: '📚' },
            'presentasi': { label: 'Presentasi', badge: 'badge-presentasi', icon: '📊' },
        };

        // ==================== CATEGORY CONFIG ====================
        const categoryConfig = {
            'company-profile': { label: 'Company Profile', color: 'bg-slate-600' },
            'geogrid': { label: 'Geogrid', color: 'bg-blue-600' },
            'geomembrane': { label: 'Geomembrane', color: 'bg-emerald-600' },
            'geotextile': { label: 'Geotextile', color: 'bg-purple-600' },
            'retaining-wall': { label: 'Retaining Wall', color: 'bg-amber-600' },
            'erosion-control': { label: 'Kontrol Erosi', color: 'bg-green-600' },
            'presentasi': { label: 'Presentasi', color: 'bg-orange-600' },
            'geocell': { label: 'Geocell', color: 'bg-cyan-600' },
            'asphalt': { label: 'Asphalt', color: 'bg-rose-600' },
        };

        // ==================== COMPONENTS ====================

        // Category Filter Pill
        const CategoryPill = ({ category, isActive, onClick, count }) => {
            const config = categoryConfig[category.id] || { label: category.name, color: 'bg-gray-600' };
            return (
                <button
                    onClick={onClick}
                    className={`px-3.5 py-1.5 rounded-full text-xs font-semibold transition-all duration-200 flex items-center gap-1.5 whitespace-nowrap ${isActive
                        ? `${config.color} text-white shadow-md scale-105`
                        : 'bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-700 border border-slate-200 dark:border-slate-700'
                        }`}
                >
                    {config.label}
                    {count > 0 && (
                        <span className={`text-[10px] px-1.5 py-0.2 rounded-full font-bold ${isActive ? 'bg-white/20 text-white' : 'bg-slate-100 dark:bg-slate-700 text-slate-500 dark:text-slate-400'}`}>
                            {count}
                        </span>
                    )}
                </button>
            );
        };

        // File Download Button - Shows full file name
        const FileButton = ({ file, onDownload }) => {
            const config = fileTypeConfig[file.type] || { label: file.type, badge: 'badge-brosur', icon: '📄' };
            const displayName = file.name.replace(/\.pdf$/i, '');
            return (
                <button
                    onClick={() => onDownload(file)}
                    className={`group flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg text-xs font-medium transition-all duration-200 ${config.badge} hover:scale-105 hover:shadow-md max-w-full`}
                    title={file.name}
                >
                    <span className="flex-shrink-0">{config.icon}</span>
                    <span className="truncate max-w-[180px] md:max-w-[240px]">{displayName}</span>
                    <Icons.Download className="w-3 h-3 flex-shrink-0 opacity-60 group-hover:opacity-100 transition-opacity" />
                </button>
            );
        };

        // Indexed List View Component (Table / Row List)
        const IndexedListView = ({ items, categoryConfig, fileTypeConfig, onDownload }) => {
            return (
                <div className="w-full bg-white dark:bg-slate-800/90 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700/80 overflow-hidden animate-fade-in">
                    <div className="overflow-x-auto">
                        <table className="w-full text-left border-collapse text-sm">
                            <thead>
                                <tr className="border-b border-slate-200 dark:border-slate-700 bg-slate-50/90 dark:bg-slate-900/80 text-slate-500 dark:text-slate-400 uppercase text-[11px] font-bold tracking-wider">
                                    <th className="py-3.5 px-4 text-center w-12">#</th>
                                    <th className="py-3.5 px-4">Nama Produk & Detail</th>
                                    <th className="py-3.5 px-4 hidden md:table-cell w-40">Kategori</th>
                                    <th className="py-3.5 px-4">Dokumentasi & Berkas</th>
                                </tr>
                            </thead>
                            <tbody className="divide-y divide-slate-100 dark:divide-slate-700/60">
                                {items.map((item, index) => {
                                    const catConfig = categoryConfig[item.category] || { label: item.category, color: 'bg-slate-600' };
                                    return (
                                        <tr key={item.id} className="hover:bg-slate-50/80 dark:hover:bg-slate-700/30 transition-colors group">
                                            {/* Index Number */}
                                            <td className="py-4 px-4 text-center font-mono text-xs font-bold text-slate-400 dark:text-slate-500 align-top">
                                                {String(index + 1).padStart(2, '0')}
                                            </td>

                                            {/* Title & Details */}
                                            <td className="py-4 px-4 align-top">
                                                <div className="flex items-center gap-2">
                                                    <span className="font-bold text-slate-900 dark:text-slate-100 group-hover:text-red-600 dark:group-hover:text-red-400 transition-colors text-base">
                                                        {item.title}
                                                    </span>
                                                    {item.highlight && (
                                                        <span className="text-amber-500" title="Produk Unggulan">
                                                            <Icons.Star className="w-4 h-4 fill-amber-400" />
                                                        </span>
                                                    )}
                                                </div>
                                                {item.subcategory && (
                                                    <div className="inline-flex items-center gap-1 text-xs text-slate-500 dark:text-slate-400 mt-0.5 font-medium">
                                                        <Icons.Folder className="w-3 h-3 text-slate-400" />
                                                        {item.subcategory}
                                                    </div>
                                                )}
                                                <p className="text-xs text-slate-500 dark:text-slate-400 mt-1 line-clamp-2 leading-relaxed">
                                                    {item.description}
                                                </p>
                                                <div className="flex flex-wrap gap-1 mt-2 md:hidden">
                                                    <span className={`text-[10px] font-bold px-2 py-0.5 rounded-full text-white ${catConfig.color}`}>
                                                        {catConfig.label}
                                                    </span>
                                                </div>
                                            </td>

                                            {/* Category Pill */}
                                            <td className="py-4 px-4 align-top hidden md:table-cell whitespace-nowrap">
                                                <span className={`inline-block text-[10px] font-extrabold px-2.5 py-1 rounded-full text-white tracking-wide uppercase ${catConfig.color}`}>
                                                    {catConfig.label}
                                                </span>
                                            </td>

                                            {/* Files Section */}
                                            <td className="py-4 px-4 align-top">
                                                <div className="flex flex-wrap gap-1.5">
                                                    {item.files.map((file, fIdx) => (
                                                        <FileButton key={fIdx} file={file} onDownload={onDownload} />
                                                    ))}
                                                    {item.files.length === 0 && (
                                                        <span className="text-xs text-slate-400 italic">Belum ada file</span>
                                                    )}
                                                </div>
                                            </td>
                                        </tr>
                                    );
                                })}
                            </tbody>
                        </table>
                    </div>
                </div>
            );
        };

        // Category Accordion / Grouped View Component
        const CategoryGroupView = ({ items, categories, categoryConfig, fileTypeConfig, onDownload }) => {
            const [openCats, setOpenCats] = useState({});

            const toggleCat = (catId) => {
                setOpenCats(prev => ({
                    ...prev,
                    [catId]: prev[catId] === undefined ? false : !prev[catId]
                }));
            };

            const grouped = useMemo(() => {
                const groups = {};
                items.forEach(item => {
                    if (!groups[item.category]) groups[item.category] = [];
                    groups[item.category].push(item);
                });
                return groups;
            }, [items]);

            return (
                <div className="space-y-4 animate-fade-in">
                    {categories.map(cat => {
                        const catItems = grouped[cat.id] || [];
                        if (catItems.length === 0) return null;

                        const isOpen = openCats[cat.id] !== false;
                        const config = categoryConfig[cat.id] || { label: cat.name, color: 'bg-slate-600' };

                        return (
                            <div key={cat.id} className="bg-white dark:bg-slate-800/90 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700/80 overflow-hidden">
                                <button
                                    onClick={() => toggleCat(cat.id)}
                                    className="w-full p-4 flex items-center justify-between bg-slate-50/90 dark:bg-slate-900/80 hover:bg-slate-100/80 dark:hover:bg-slate-700/50 transition-colors text-left"
                                >
                                    <div className="flex items-center gap-3">
                                        <span className={`w-3.5 h-3.5 rounded-full ${config.color}`}></span>
                                        <h3 className="text-base font-bold text-slate-800 dark:text-slate-100">
                                            {config.label}
                                        </h3>
                                        <span className="text-xs px-2.5 py-0.5 rounded-full bg-slate-200 dark:bg-slate-700 text-slate-700 dark:text-slate-300 font-bold">
                                            {catItems.length} produk
                                        </span>
                                    </div>
                                    <Icons.ChevronRight className={`w-5 h-5 text-slate-400 transition-transform ${isOpen ? 'rotate-90' : ''}`} />
                                </button>

                                {isOpen && (
                                    <IndexedListView
                                        items={catItems}
                                        categoryConfig={categoryConfig}
                                        fileTypeConfig={fileTypeConfig}
                                        onDownload={onDownload}
                                    />
                                )}
                            </div>
                        );
                    })}
                </div>
            );
        };

        // Product Card (Grid View)
        const ProductCard = ({ item, onDownload }) => {
            const catConfig = categoryConfig[item.category] || { label: item.category, color: 'bg-gray-600' };

            return (
                <div className="rounded-2xl shadow-sm border overflow-hidden card-hover animate-fade-in flex flex-col h-full" style={{ background: 'var(--bg-card)', borderColor: 'var(--border-color)' }}>

                    <div className="p-5 pb-3 flex-1">

                                <span className="flex items-center gap-1 text-amber-500" title="Featured Product">
                                    <Icons.Star className="w-4 h-4" />
