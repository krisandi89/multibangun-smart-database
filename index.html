                                                                                <div className="flex items-center gap-2 min-w-0 flex-1">
                                                                                    <span title={file.gdriveId ? 'Google Drive' : 'GitHub'}>{getStorageIcon(file)}</span>
                                                                                    <span className={`text-[10px] px-1.5 py-0.5 rounded ${fileTypeConfig[file.type]?.badge || 'bg-slate-100'}`}>
                                                                                        {fileTypeConfig[file.type]?.label || file.type}
                                                                                    </span>
                                                                                    <span className="truncate text-xs">{file.name}</span>
                                                                                </div>
                                                                                <button
                                                                                    onClick={() => setDeleteModal({ open: true, type: 'file', productId: item.id, fileIndex: idx, name: file.name })}
                                                                                    className="p-1 rounded hover:bg-red-100 dark:hover:bg-red-900/30 text-slate-400 hover:text-red-500 transition flex-shrink-0"
                                                                                    title="Hapus File"
                                                                                >
                                                                                    <svg className="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>
                                                                                </button>
                                                                            </div>
                                                                        ))}
                                                                        {item.files.length === 0 && (
                                                                            <p className="text-xs text-slate-400 text-center py-2">Tidak ada file</p>
                                                                        )}
                                                                    </div>
                                                                )}
                                                            </div>
                                                        ))}
                                                        {filteredItems.length === 0 && (
                                                            <p className="text-center text-slate-400 py-8">Tidak ada produk ditemukan</p>
                                                        )}
                                                    </div>
                                                </div>
                                            )}

                                            {/* Settings Tab */}
                                            {activeTab === 'settings' && (
                                                <div className="space-y-4">
                                                    {/* Error Message */}
                                                    {error && (
                                                        <div className="p-3 rounded-lg bg-red-100 dark:bg-red-900/30 border border-red-300 dark:border-red-700">
                                                            <div className="flex items-center justify-between">
                                                                <p className="text-sm text-red-600 dark:text-red-400">❌ {error}</p>
                                                                <button onClick={() => setError('')} className="text-red-500 hover:text-red-700">
                                                                    <Icons.X className="w-4 h-4" />
                                                                </button>
                                                            </div>
                                                        </div>
                                                    )}

                                                    {/* Settings Sub-tabs */}
                                                    <div className="flex gap-2">
                                                        <button
                                                            onClick={() => setSettingsTab('categories')}
                                                            className={`flex-1 py-2 px-3 rounded-lg text-sm font-medium transition ${settingsTab === 'categories' ? 'bg-blue-600 text-white' : 'bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300'}`}
                                                        >
                                                            🏷️ Kategori
                                                        </button>
                                                        <button
                                                            onClick={() => setSettingsTab('fileTypes')}
                                                            className={`flex-1 py-2 px-3 rounded-lg text-sm font-medium transition ${settingsTab === 'fileTypes' ? 'bg-blue-600 text-white' : 'bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300'}`}
                                                        >
                                                            📄 Tipe File
                                                        </button>
                                                    </div>

                                                    {settingsTab === 'categories' && (
                                                        <div className="space-y-4">
                                                            <h4 className="font-bold text-sm">Kategori ({categories.length})</h4>

                                                            <div className="bg-slate-50 dark:bg-slate-900 p-3 rounded-lg space-y-2">
                                                                <p className="text-xs font-bold uppercase">Tambah Kategori Baru</p>
                                                                <div className="grid grid-cols-2 gap-2">
                                                                    <input
                                                                        type="text"
                                                                        placeholder="ID (contoh: drainage)"
                                                                        value={newCategory.id}
                                                                        onChange={e => setNewCategory({ ...newCategory, id: e.target.value.toLowerCase().replace(/\s+/g, '-') })}
                                                                        className="p-2 rounded border text-sm dark:bg-slate-700 dark:border-slate-600"
                                                                    />
                                                                    <input
                                                                        type="text"
                                                                        placeholder="Nama kategori"
                                                                        value={newCategory.name}
                                                                        onChange={e => setNewCategory({ ...newCategory, name: e.target.value })}
                                                                        className="p-2 rounded border text-sm dark:bg-slate-700 dark:border-slate-600"
                                                                    />
                                                                </div>
                                                                <div className="flex items-center gap-2">
                                                                    <span className="text-xs">Warna:</span>
                                                                    <div className="flex gap-1 flex-wrap">
                                                                        {colorOptions.map(color => (
                                                                            <button
                                                                                key={color}
                                                                                type="button"
                                                                                onClick={() => setNewCategory({ ...newCategory, color })}
                                                                                className={`w-5 h-5 rounded-full ${color} ${newCategory.color === color ? 'ring-2 ring-offset-1 ring-blue-500' : ''}`}
                                                                            />
                                                                        ))}
                                                                    </div>
                                                                </div>
                                                                <button
                                                                    onClick={handleAddCategory}
                                                                    disabled={isProcessing}
                                                                    className="w-full py-2 bg-green-600 hover:bg-green-700 text-white rounded-lg text-sm font-medium disabled:opacity-50"
                                                                >
                                                                    {isProcessing ? '⏳ Menyimpan...' : '➕ Tambah Kategori'}
                                                                </button>
                                                            </div>

                                                            {/* Categories List */}
                                                            <div className="space-y-2 max-h-[250px] overflow-y-auto">
                                                                {categories.map(cat => (
                                                                    <div key={cat.id} className="flex items-center justify-between bg-white dark:bg-slate-800 p-2 rounded-lg border dark:border-slate-700">
                                                                        <div className="flex items-center gap-2">
                                                                            <span className={`w-4 h-4 rounded-full ${cat.color || 'bg-slate-500'}`}></span>
                                                                            <span className="text-sm font-medium">{cat.name}</span>
                                                                            <span className="text-xs text-slate-400">({cat.id})</span>
                                                                        </div>
                                                                        <button
                                                                            onClick={() => handleDeleteCategory(cat.id)}
                                                                            disabled={isProcessing}
                                                                            className="p-1 rounded hover:bg-red-100 dark:hover:bg-red-900/30 text-slate-400 hover:text-red-500 transition disabled:opacity-50"
                                                                            title="Hapus Kategori"
                                                                        >
                                                                            <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>
                                                                        </button>
                                                                    </div>
                                                                ))}
                                                            </div>
                                                        </div>
                                                    )}

                                                    {/* File Types Management */}
                                                    {settingsTab === 'fileTypes' && (
                                                        <div className="space-y-4">
                                                            <h4 className="font-bold text-sm">Tipe File ({fileTypes?.length || 0})</h4>

                                                            {/* Add New File Type */}
                                                            <div className="bg-slate-50 dark:bg-slate-900 p-3 rounded-lg space-y-2">
                                                                <p className="text-xs font-bold uppercase">Tambah Tipe File Baru</p>
                                                                <div className="grid grid-cols-2 gap-2">
                                                                    <input
                                                                        type="text"
                                                                        placeholder="ID (contoh: tutorial)"
                                                                        value={newFileType.id}
                                                                        onChange={e => setNewFileType({ ...newFileType, id: e.target.value.toLowerCase().replace(/\s+/g, '-') })}
                                                                        className="p-2 rounded border text-sm dark:bg-slate-700 dark:border-slate-600"
                                                                    />
                                                                    <input
                                                                        type="text"
                                                                        placeholder="Label tampilan"
                                                                        value={newFileType.label}
                                                                        onChange={e => setNewFileType({ ...newFileType, label: e.target.value })}
                                                                        className="p-2 rounded border text-sm dark:bg-slate-700 dark:border-slate-600"
                                                                    />
                                                                </div>
                                                                <div className="flex items-center gap-2">
                                                                    <span className="text-xs">Icon:</span>
                                                                    <input
                                                                        type="text"
                                                                        value={newFileType.icon}
                                                                        onChange={e => setNewFileType({ ...newFileType, icon: e.target.value })}
                                                                        className="w-12 p-1 rounded border text-center dark:bg-slate-700 dark:border-slate-600"
                                                                    />
                                                                    <span className="text-xs">Badge:</span>
                                                                    <select
                                                                        value={newFileType.badge}
                                                                        onChange={e => setNewFileType({ ...newFileType, badge: e.target.value })}
                                                                        className="p-1 rounded border text-sm dark:bg-slate-700 dark:border-slate-600"
                                                                    >
                                                                        {badgeOptions.map(b => <option key={b} value={b}>{b}</option>)}
                                                                    </select>
                                                                </div>
                                                                <button
                                                                    onClick={handleAddFileType}
                                                                    disabled={isProcessing}
                                                                    className="w-full py-2 bg-green-600 hover:bg-green-700 text-white rounded-lg text-sm font-medium disabled:opacity-50"
                                                                >
                                                                    {isProcessing ? '⏳ Menyimpan...' : '➕ Tambah Tipe File'}
                                                                </button>
                                                            </div>

                                                            <div className="space-y-2 max-h-[250px] overflow-y-auto">

                                                                    <div key={ft.id} className="flex items-center justify-between bg-white dark:bg-slate-800 p-2 rounded-lg border dark:border-slate-700">
                                                                        <div className="flex items-center gap-2">
                                                                            <span>{ft.icon}</span>
                                                                            <span className={`text-xs px-1.5 py-0.5 rounded ${ft.badge}`}>{ft.label}</span>
                                                                            <span className="text-xs text-slate-400">({ft.id})</span>
                                                                        </div>
                                                                        <button
                                                                            onClick={() => handleDeleteFileType(ft.id)}
                                                                            disabled={isProcessing}
                                                                            className="p-1 rounded hover:bg-red-100 dark:hover:bg-red-900/30 text-slate-400 hover:text-red-500 transition disabled:opacity-50"
                                                                            title="Hapus Tipe File"
                                                                        >
                                                                            <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>
                                                                        </button>
                                                                    </div>
                                                                ))}
                                                            </div>
                                                        </div>
                                                    )}
                                                </div>
                                            )}
                                        </div>

                                        {editProduct && (
                                            <div className="fixed inset-0 z-[60] flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm">

                                                    {error && (
                                                        <div className="p-2 mb-3 rounded-lg bg-red-100 dark:bg-red-900/30 text-sm text-red-600 dark:text-red-400">
                                                            ❌ {error}

                                                            <label className="block text-xs font-bold uppercase mb-1">Judul</label>
                                                            <input
                                                                type="text"
                                                                value={editFormData.title}
                                                                onChange={e => setEditFormData({ ...editFormData, title: e.target.value })}
                                                                className="w-full p-2 rounded border dark:bg-slate-700 dark:border-slate-600"
                                                            />
                                                        </div>
                                                        <div>
                                                            <label className="block text-xs font-bold uppercase mb-1">Kategori</label>
                                                            <select
                                                                value={editFormData.category}
                                                                onChange={e => setEditFormData({ ...editFormData, category: e.target.value })}
                                                                className="w-full p-2 rounded border dark:bg-slate-700 dark:border-slate-600"
                                                            >
                                                                {categories.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
                                                            </select>
                                                        </div>
                                                        <div>
                                                            <label className="block text-xs font-bold uppercase mb-1">Deskripsi</label>
                                                            <textarea
                                                                value={editFormData.description}
                                                                onChange={e => setEditFormData({ ...editFormData, description: e.target.value })}
                                                                rows="3"
                                                                className="w-full p-2 rounded border dark:bg-slate-700 dark:border-slate-600"
                                                            ></textarea>
                                                        </div>
                                                    </div>
                                                    <div className="flex gap-3 mt-4">
                                                        <button
                                                            onClick={() => { setEditProduct(null); setError(''); }}
                                                            disabled={isProcessing}
                                                            className="flex-1 py-2.5 px-4 rounded-lg border border-slate-300 dark:border-slate-600 font-medium hover:bg-slate-50 dark:hover:bg-slate-700 transition disabled:opacity-50"
                                                        >
                                                            Batal
                                                        </button>
                                                        <button
                                                            onClick={handleSaveEditProduct}
                                                            disabled={isProcessing}
                                                            className="flex-1 py-2.5 px-4 rounded-lg bg-blue-600 hover:bg-blue-700 text-white font-medium transition disabled:opacity-50"
                                                        >
                                                            {isProcessing ? '⏳ Menyimpan...' : '💾 Simpan'}
                                                        </button>
                                                    </div>
                                                </div>
                                            </div>
                                        )}
                                    </>
                                )}

                                {step === 'uploading' && (
                                    <div className="p-6 space-y-3">
                                        <div className="flex justify-center mb-4">
                                            <div className="animate-spin rounded-full h-10 w-10 border-b-2 border-blue-600"></div>
                                        </div>
                                        <h4 className="text-center font-bold">Sedang Memproses...</h4>
                                        <div className="bg-slate-100 dark:bg-slate-900 p-3 rounded-lg font-mono text-xs space-y-1 max-h-40 overflow-y-auto">
                                            {logs.map((log, i) => <div key={i}>{log}</div>)}
                                        </div>
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>
                </>
            );
        };





        // ==================== MAIN APP ====================
        const MultibangunSmartDatabase = () => {
            const [database, setDatabase] = useState({ categories: [], items: [], fileTypes: [] });

            // Admin & Quick Add Modals State
            const [isAdminOpen, setIsAdminOpen] = useState(false);
            const [isQuickAddOpen, setIsQuickAddOpen] = useState(false);

            // View controls: 'list' (default indexed table view), 'grouped' (accordion by category), 'grid' (card grid)
            const [viewMode, setViewMode] = useState('list');
            const [alphaFilter, setAlphaFilter] = useState('all');

            const [query, setQuery] = useState('');
            const [activeCategory, setActiveCategory] = useState('all');
            const [results, setResults] = useState([]);
            const [isLoading, setIsLoading] = useState(true);
            const [darkMode, setDarkMode] = useState(() => {
                if (typeof window !== 'undefined') {
                    const saved = localStorage.getItem('darkMode');
                    if (saved !== null) return saved === 'true';
                    return window.matchMedia('(prefers-color-scheme: dark)').matches;
                }
                return false;
            });
            const searchInputRef = useRef(null);

            const handleUpdateDatabase = (newDatabase) => {
                if (!newDatabase || !newDatabase.items) return;
                const localSaved = JSON.parse(localStorage.getItem('custom_mb_items') || '[]');
                const mergedItems = [...localSaved, ...newDatabase.items];
                const mergedData = { ...newDatabase, items: mergedItems };
                setDatabase(mergedData);
                setResults(mergedData.items);
                setIsLoading(false);
            };

            const handleManualReload = async () => {
                setIsLoading(true);
                try {
                    const token = localStorage.getItem('gh_token');
                    let data = null;
                    if (token) {
                        const gh = new GithubService(token);
                        data = await gh.getDataJson();
                    } else {
                        const res = await fetch(`data.json?t=${new Date().getTime()}`);
                        data = await res.json();
                    }
                    if (data && data.items) {
                        handleUpdateDatabase(data);
                    }
                } catch (err) {
                    console.error("Reload error:", err);
                }
                setIsLoading(false);
            };

            const handleUploadSuccess = () => {
                handleManualReload();
            };

            const toggleDarkMode = () => {
                setDarkMode(prev => {
                    const newValue = !prev;
                    localStorage.setItem('darkMode', newValue);
                    return newValue;
                });
            };

            useEffect(() => {
                if (darkMode) {
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                }
            }, [darkMode]);

            // Load database
            useEffect(() => {
                handleManualReload();
            }, []);

            // Alphabet list generator for A-Z index
            const alphabets = ['all', ...'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('')];

            // Search & Filter Effect
            useEffect(() => {
                let filtered = database.items;

                if (query) {
                    const lowerQuery = query.toLowerCase();
                    filtered = filtered.filter(item =>
                        item.title.toLowerCase().includes(lowerQuery) ||
                        item.description.toLowerCase().includes(lowerQuery) ||
                        item.tags.some(tag => tag.toLowerCase().includes(lowerQuery)) ||
                        (item.subcategory && item.subcategory.toLowerCase().includes(lowerQuery)) ||
                        item.files.some(f => f.name.toLowerCase().includes(lowerQuery))
                    );
                }

                if (activeCategory !== 'all') {
                    filtered = filtered.filter(item => item.category === activeCategory);
                }

                if (alphaFilter !== 'all') {
                    filtered = filtered.filter(item => item.title.trim().toUpperCase().startsWith(alphaFilter));
                }

                setResults(filtered);
            }, [query, activeCategory, alphaFilter, database.items]);

            // Keyboard shortcut
            useEffect(() => {
                const handleKeyDown = (e) => {
                    if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
                        e.preventDefault();
                        searchInputRef.current?.focus();
                    }
                    if (e.key === 'Escape') {
                        setQuery('');
                        searchInputRef.current?.blur();
                    }
                };
                window.addEventListener('keydown', handleKeyDown);
                return () => window.removeEventListener('keydown', handleKeyDown);
            }, []);

            const GDRIVE_MAIN_FOLDER = '1ED8mMfEQHKM0wlOZBD9adW4F-8KJk96m';

            const handleDownload = (file) => {
                const isLocal = window.location.protocol === 'file:';

                if (isLocal) {
                    const link = document.createElement('a');
                    link.href = file.path;
                    link.download = file.name;
                    link.target = '_blank';
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                } else {
                    if (file.gdriveId) {
                        window.open(`https://drive.google.com/file/d/${file.gdriveId}/view`, '_blank');
                    } else if (file.gdriveId === '') {
                        window.open(file.path, '_blank');
                    } else {
                        const fileName = file.path.split('/').pop();
                        window.open(`https://drive.google.com/drive/folders/${GDRIVE_MAIN_FOLDER}?q=${encodeURIComponent(fileName)}`, '_blank');
                    }
                }
            };

            const categoryCounts = useMemo(() => {
                const counts = { all: database.items.length };
                database.items.forEach(item => {
                    counts[item.category] = (counts[item.category] || 0) + 1;
                });
                return counts;
            }, [database.items]);

            return (
                <div className="min-h-screen">
                    {/* Admin Modal */}
                    <AdminModal
                        isOpen={isAdminOpen}
                        onClose={() => setIsAdminOpen(false)}
                        categories={database.categories}
                        fileTypes={database.fileTypes}
                        items={database.items}
                        onUploadSuccess={handleUploadSuccess}
                        onUpdateDatabase={handleUpdateDatabase}
                        onManualReload={handleManualReload}
                    />

                    {/* Quick Add Modal */}
                    <QuickAddMaterialModal
                        isOpen={isQuickAddOpen}
                        onClose={() => setIsQuickAddOpen(false)}
                        categories={database.categories}
                        fileTypes={database.fileTypes}
                        onSaveSuccess={handleUploadSuccess}
                    />

                    {/* Top Action Bar / Header Controls */}
                    <header className="sticky top-0 z-40 bg-white/80 dark:bg-slate-900/80 backdrop-blur-md border-b border-slate-200/80 dark:border-slate-800 px-4 md:px-8 py-3 transition-colors">
                        <div className="max-w-7xl mx-auto flex items-center justify-between gap-4">
                            {/* Brand / Logo */}
                            <div className="flex items-center gap-2.5 cursor-pointer" onClick={() => { setQuery(''); setActiveCategory('all'); setAlphaFilter('all'); }}>
                                <div className="w-8 h-8 rounded-xl bg-gradient-to-br from-red-600 to-red-700 flex items-center justify-center text-white font-extrabold text-xs shadow-md">
                                    MB
                                </div>
                                <span className="font-extrabold text-base tracking-tight hidden sm:inline-block" style={{ color: 'var(--text-primary)' }}>
                                    Multibangun <span className="gradient-text">Smart DB</span>
                                </span>
                            </div>

                            {/* Top Right Action Buttons */}
                            <div className="flex items-center gap-2">
                                {/* + Tambah Materi Button */}
                                <button
                                    onClick={() => setIsQuickAddOpen(true)}
                                    className="bg-gradient-to-r from-red-600 to-red-700 hover:from-red-700 hover:to-red-800 text-white font-extrabold text-xs sm:text-sm px-3.5 sm:px-4 py-2 rounded-xl shadow-md hover:shadow-lg hover:scale-105 transition-all flex items-center gap-1.5"
                                >
                                    <Icons.Plus className="w-4 h-4 stroke-[3]" />
                                    <span>Tambah Materi</span>
                                </button>

                                {/* Admin Gear Button */}
                                <button
                                    onClick={() => setIsAdminOpen(true)}
                                    className="p-2 rounded-xl bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300 hover:text-blue-600 dark:hover:text-blue-400 hover:scale-105 transition-all"
                                    title="Kelola Database & Admin Mode"
                                >
                                    <svg xmlns="http://www.w3.org/2000/svg" className="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                                        <circle cx="12" cy="12" r="3"></circle>
                                        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                                    </svg>
                                </button>

                                {/* Dark Mode Toggle Button */}
                                <button
                                    onClick={toggleDarkMode}
                                    className="p-2 rounded-xl bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300 hover:scale-105 transition-all"
                                    aria-label="Toggle dark mode"
                                >
                                    {darkMode ? (
                                        <svg xmlns="http://www.w3.org/2000/svg" className="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                                            <circle cx="12" cy="12" r="5" />
                                            <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42" />
                                        </svg>
                                    ) : (
                                        <svg xmlns="http://www.w3.org/2000/svg" className="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                                            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
                                        </svg>
                                    )}
                                </button>
                            </div>
                        </div>
                    </header>

                    {/* HERO / SPOTLIGHT */}
                    <div className="pt-10 pb-8 px-4 md:px-8">
                        <div className="max-w-4xl mx-auto text-center mb-8">
                            <h1 className="text-3xl md:text-5xl font-black mb-3 tracking-tight leading-tight" style={{ color: 'var(--text-primary)' }}>
                                Multibangun <span className="gradient-text">Smart</span> Database
                            </h1>
                            <p style={{ color: 'var(--text-secondary)' }} className="text-sm md:text-base max-w-xl mx-auto">
                                Katalog terindeks & dokumentasi produk geosintetik PT. Multibangun Rekatama Patria
                            </p>
                        </div>

                        {/* Spotlight Search Input */}
                        <div className="max-w-3xl mx-auto relative">
                            <div className="relative spotlight-glow rounded-2xl transition-all duration-300" style={{ background: 'var(--search-bg)' }}>
                                <div className="absolute inset-y-0 left-0 pl-5 flex items-center pointer-events-none">
                                    <Icons.Search className={`w-5 h-5 transition-colors ${query ? 'text-red-500' : 'text-slate-400'}`} />
                                </div>
                                <input
                                    ref={searchInputRef}
                                    type="text"
                                    value={query}
                                    onChange={(e) => setQuery(e.target.value)}
                                    placeholder="Cari nama produk, spesifikasi, atau kata kunci..."
                                    className="w-full pl-14 pr-28 py-4 bg-transparent rounded-2xl text-base focus:outline-none"
                                    style={{ color: 'var(--text-primary)' }}
                                    autoComplete="off"
                                />
                                <div className="absolute inset-y-0 right-3.5 flex items-center gap-2">
                                    {query && (
                                        <button
                                            onClick={() => setQuery('')}
                                            className="p-1.5 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-lg transition-colors"
                                            style={{ color: 'var(--text-muted)' }}
                                        >
                                            <Icons.X className="w-4 h-4" />
                                        </button>
                                    )}
                                    <kbd className="hidden md:flex items-center gap-1 px-2 py-1 rounded-lg text-[11px] font-medium" style={{ background: 'var(--bg-secondary)', color: 'var(--text-muted)' }}>
                                        <Icons.Command className="w-3 h-3" /> K
                                    </kbd>
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* MAIN CONTENT AREA */}
                    <main className="max-w-7xl mx-auto px-4 md:px-8 pb-24 space-y-6">

                        {/* CONTROLS & FILTER TOOLBAR */}
                        <div className="bg-white/80 dark:bg-slate-800/80 backdrop-blur rounded-2xl p-4 border border-slate-200/80 dark:border-slate-700/80 shadow-sm space-y-3.5">
                            
                            {/* View Switcher & Counter */}
                            <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3 pb-3 border-b border-slate-100 dark:border-slate-700/60">
                                <div className="flex items-center gap-2">
                                    <span className="text-xs font-bold uppercase tracking-wider text-slate-400">Tampilan:</span>
                                    <div className="inline-flex p-1 rounded-xl bg-slate-100 dark:bg-slate-900 border border-slate-200 dark:border-slate-800">
                                        <button
                                            onClick={() => setViewMode('list')}
                                            className={`px-3 py-1.5 rounded-lg text-xs font-bold transition-all flex items-center gap-1.5 ${viewMode === 'list'
                                                ? 'bg-white dark:bg-slate-800 text-red-600 dark:text-red-400 shadow-sm'
                                                : 'text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-slate-200'
                                                }`}
                                        >
                                            <Icons.List className="w-3.5 h-3.5" />
                                            <span>List Terindeks</span>
                                        </button>

                                        <button
                                            onClick={() => setViewMode('grouped')}
                                            className={`px-3 py-1.5 rounded-lg text-xs font-bold transition-all flex items-center gap-1.5 ${viewMode === 'grouped'
                                                ? 'bg-white dark:bg-slate-800 text-red-600 dark:text-red-400 shadow-sm'
                                                : 'text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-slate-200'
                                                }`}
                                        >
                                            <Icons.Layers className="w-3.5 h-3.5" />
                                            <span>Per Kategori</span>
                                        </button>

                                        <button
                                            onClick={() => setViewMode('grid')}
                                            className={`px-3 py-1.5 rounded-lg text-xs font-bold transition-all flex items-center gap-1.5 ${viewMode === 'grid'
                                                ? 'bg-white dark:bg-slate-800 text-red-600 dark:text-red-400 shadow-sm'
                                                : 'text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-slate-200'
                                                }`}
                                        >
                                            <Icons.Grid className="w-3.5 h-3.5" />
                                            <span>Card Grid</span>
                                        </button>
                                    </div>
                                </div>

                                <div className="text-xs font-semibold text-slate-500 dark:text-slate-400 flex items-center gap-2">
                                    <span>Menampilkan <strong className="text-slate-800 dark:text-slate-200 font-extrabold">{results.length}</strong> produk</span>
                                    {(query || activeCategory !== 'all' || alphaFilter !== 'all') && (
                                        <button
                                            onClick={() => { setQuery(''); setActiveCategory('all'); setAlphaFilter('all'); }}
                                            className="text-red-600 dark:text-red-400 hover:underline font-bold text-[11px]"
                                        >
                                            Reset Filter
                                        </button>
                                    )}
                                </div>
                            </div>

                            {/* Category Filter Pills Bar */}
                            <div className="flex items-center gap-2 overflow-x-auto pb-1 scrollbar-none">
                                <button
                                    onClick={() => setActiveCategory('all')}
                                    className={`px-3.5 py-1.5 rounded-full text-xs font-semibold transition-all flex items-center gap-1.5 whitespace-nowrap ${activeCategory === 'all'
                                        ? 'bg-slate-900 dark:bg-slate-100 text-white dark:text-slate-900 shadow-md scale-105 font-bold'
                                        : 'bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-700 border border-slate-200 dark:border-slate-700'
                                        }`}
                                >
                                    Semua Kategori ({categoryCounts.all || 0})
                                </button>
                                {database.categories.map(cat => (
                                    <CategoryPill
                                        key={cat.id}
                                        category={cat}
                                        isActive={activeCategory === cat.id}
                                        onClick={() => setActiveCategory(activeCategory === cat.id ? 'all' : cat.id)}
                                        count={categoryCounts[cat.id] || 0}
                                    />
                                ))}
                            </div>

                            {/* Alphabetical A-Z Quick Jump Bar */}
                            <div className="flex items-center gap-1 overflow-x-auto pt-1 scrollbar-none text-xs">
                                <span className="text-[10px] font-bold uppercase text-slate-400 mr-1.5 flex-shrink-0">Indeks A-Z:</span>
                                {alphabets.map(char => (
                                    <button
                                        key={char}
                                        onClick={() => setAlphaFilter(char)}
                                        className={`px-2 py-0.5 rounded font-mono text-[11px] font-bold transition-colors flex-shrink-0 ${alphaFilter === char
                                            ? 'bg-red-600 text-white'
                                            : 'text-slate-500 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-700'
                                            }`}
                                    >
                                        {char === 'all' ? 'SEMUA' : char}
                                    </button>
                                ))}
                            </div>
                        </div>

                        {/* RENDER PRODUCT LIST ACCORDING TO SELECTED VIEW MODE */}
                        {results.length > 0 ? (
                            <>
                                {viewMode === 'list' && (
                                    <IndexedListView
                                        items={results}
                                        categoryConfig={categoryConfig}
                                        fileTypeConfig={fileTypeConfig}
                                        onDownload={handleDownload}
                                    />
                                )}

                                {viewMode === 'grouped' && (
                                    <CategoryGroupView
                                        items={results}
                                        categories={database.categories}
                                        categoryConfig={categoryConfig}
                                        fileTypeConfig={fileTypeConfig}
                                        onDownload={handleDownload}
                                    />
                                )}

                                {viewMode === 'grid' && (
                                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                                        {results.map((item) => (
                                            <ProductCard key={item.id} item={item} onDownload={handleDownload} />
                                        ))}
                                    </div>
                                )}
                            </>
                        ) : (
                            <EmptyState query={query} />
                        )}
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<MultibangunSmartDatabase />);
    </script>
</body>

</html>
